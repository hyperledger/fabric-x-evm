# Standalone org1 endorser config. Paths are relative to the integration/
# package directory (where go test runs). No gateway section: this process
# is dialed as a remote endorser over gRPC, not run as a combined app.

network:
  protocol: fabric
  channel: mychannel
  namespace: basic
  ns-version: "1.0"
  chain-id: 4011

logging:
  spec: info

committer:
  endpoint:
    host: 127.0.0.1
    port: 7041
  tls:
    mode: tls
    server-name: peer0.org1.example.com
    ca-cert-paths:
      - ../testdata/fablo/fablo-target/fabric-config/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt

endorser:
  name: org1
  identity:
    msp-id: Org1MSP
    msp-dir: ../testdata/fablo/fablo-target/fabric-config/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/msp
  database:
    database: memory
  server:
    endpoint:
      host: 127.0.0.1
      port: 0
    tls:
      mode: mtls
      cert-path: ../testdata/fablo/fablo-target/fabric-config/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/server.crt
      key-path: ../testdata/fablo/fablo-target/fabric-config/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/server.key
      ca-cert-paths:
        - ../testdata/fablo/fablo-target/fabric-config/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt
        - ../testdata/fablo/fablo-target/fabric-config/crypto-config/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/tls/ca.crt
