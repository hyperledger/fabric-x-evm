# Gateway config with a real multi-org topology: org1's own endorser is
# embedded (called in-process, matching production) and also served over
# gRPC so the test can dial it directly; org2 runs as a separate process,
# dialed as the sole gateway.endorsers remote. Paths are relative to the
# integration/ package directory (where go test runs).

network:
  protocol: fabric-x
  channel: mychannel
  namespace: basic2of2
  ns-version: "1.0"
  chain-id: 4011

logging:
  spec: info

committer:
  endpoint:
    host: 127.0.0.1
    port: 4001
  tls:
    mode: mtls
    cert-path: ../testdata/crypto/peerOrganizations/org1.example.com/users/User1@org1.example.com/tls/client.crt
    key-path: ../testdata/crypto/peerOrganizations/org1.example.com/users/User1@org1.example.com/tls/client.key
    ca-cert-paths:
      - ../testdata/crypto/peerOrganizations/org1.example.com/tlsca/tlsca.org1.example.com-cert.pem

gateway:
  listen: "0.0.0.0:8546"

  identity:
    msp-id: Org1MSP
    msp-dir: ../testdata/crypto/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp

  database:
    connection-string: "file:gateway-2of2.db?mode=memory&cache=shared"

  orderers:
    - endpoint:
        host: 127.0.0.1
        port: 7050
      tls:
        mode: mtls
        cert-path: ../testdata/crypto/peerOrganizations/org1.example.com/users/User1@org1.example.com/tls/client.crt
        key-path: ../testdata/crypto/peerOrganizations/org1.example.com/users/User1@org1.example.com/tls/client.key
        ca-cert-paths:
          - ../testdata/crypto/ordererOrganizations/orderer-org-1/tlsca/tlsca.orderer-org-1-cert.pem

  # gateway.endorsers are additional remotes: only org2, dialed over gRPC.
  endorsers:
    - endpoint:
        host: 127.0.0.1
        port: 0 # overwritten at runtime with org2 endorser's bound port
      tls:
        mode: mtls
        cert-path: ../testdata/crypto/peerOrganizations/org1.example.com/users/User1@org1.example.com/tls/client.crt
        key-path: ../testdata/crypto/peerOrganizations/org1.example.com/users/User1@org1.example.com/tls/client.key
        ca-cert-paths:
          - ../testdata/crypto/peerOrganizations/org2.example.com/tlsca/tlsca.org2.example.com-cert.pem

# org1's own endorser, embedded in this gateway process. server is set purely
# so a test can dial it directly and prove serving works - nothing in this
# topology depends on org1's endorser being reachable from outside.
endorser:
  name: org1
  identity:
    msp-id: Org1MSP
    msp-dir: ../testdata/crypto/peerOrganizations/org1.example.com/peers/endorser.org1.example.com/msp
  database:
    database: memory
  server:
    endpoint:
      host: 127.0.0.1
      port: 0
    tls:
      mode: mtls
      cert-path: ../testdata/crypto/peerOrganizations/org1.example.com/peers/endorser.org1.example.com/tls/server.crt
      key-path: ../testdata/crypto/peerOrganizations/org1.example.com/peers/endorser.org1.example.com/tls/server.key
      ca-cert-paths:
        - ../testdata/crypto/peerOrganizations/org1.example.com/tlsca/tlsca.org1.example.com-cert.pem
        - ../testdata/crypto/peerOrganizations/org2.example.com/tlsca/tlsca.org2.example.com-cert.pem
