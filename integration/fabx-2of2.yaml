# Gateway config in split-deployment mode (gateway.endorsers set): the
# gateway dials org1's and org2's endorsers over real gRPC instead of
# embedding them, one standalone endorser per config file
# (fabx-2of2-org1.yaml, fabx-2of2-org2.yaml). Paths are relative to the
# integration/ package directory (where go test runs).
#
# The endorser endpoints below are placeholders - the test binds each
# endorser's gRPC server to an ephemeral port and overwrites endpoint.port at
# runtime before building this gateway.

network:
  protocol: fabric-x
  channel: mychannel
  namespace: basic2of2
  ns-version: "1.0"
  chain-id: 4011

logging:
  spec: info

committer:
  endpoint:
    host: 127.0.0.1
    port: 4001
  tls:
    mode: mtls
    cert-path: ../testdata/crypto/peerOrganizations/org1.example.com/users/User1@org1.example.com/tls/client.crt
    key-path: ../testdata/crypto/peerOrganizations/org1.example.com/users/User1@org1.example.com/tls/client.key
    ca-cert-paths:
      - ../testdata/crypto/peerOrganizations/org1.example.com/tlsca/tlsca.org1.example.com-cert.pem

gateway:
  listen: "0.0.0.0:8546"

  identity:
    msp-id: Org1MSP
    msp-dir: ../testdata/crypto/peerOrganizations/org1.example.com/users/User1@org1.example.com/msp

  database:
    connection-string: "file:gateway-2of2.db?mode=memory&cache=shared"

  orderers:
    - endpoint:
        host: 127.0.0.1
        port: 7050
      tls:
        mode: mtls
        cert-path: ../testdata/crypto/peerOrganizations/org1.example.com/users/User1@org1.example.com/tls/client.crt
        key-path: ../testdata/crypto/peerOrganizations/org1.example.com/users/User1@org1.example.com/tls/client.key
        ca-cert-paths:
          - ../testdata/crypto/ordererOrganizations/orderer-org-1/tlsca/tlsca.orderer-org-1-cert.pem

  # Split deployment: dial org1's and org2's endorsers over gRPC rather than
  # embedding them. Both entries present the gateway's own (org1) client
  # cert; each endorser's gRPC server is configured to trust both orgs' CAs,
  # the same way the real committer's routers trust every peer org.
  endorsers:
    - endpoint:
        host: 127.0.0.1
        port: 0 # overwritten at runtime with org1 endorser's bound port
      tls:
        mode: mtls
        cert-path: ../testdata/crypto/peerOrganizations/org1.example.com/users/User1@org1.example.com/tls/client.crt
        key-path: ../testdata/crypto/peerOrganizations/org1.example.com/users/User1@org1.example.com/tls/client.key
        ca-cert-paths:
          - ../testdata/crypto/peerOrganizations/org1.example.com/tlsca/tlsca.org1.example.com-cert.pem
    - endpoint:
        host: 127.0.0.1
        port: 0 # overwritten at runtime with org2 endorser's bound port
      tls:
        mode: mtls
        cert-path: ../testdata/crypto/peerOrganizations/org1.example.com/users/User1@org1.example.com/tls/client.crt
        key-path: ../testdata/crypto/peerOrganizations/org1.example.com/users/User1@org1.example.com/tls/client.key
        ca-cert-paths:
          - ../testdata/crypto/peerOrganizations/org2.example.com/tlsca/tlsca.org2.example.com-cert.pem
