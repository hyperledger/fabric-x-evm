# Standalone org2 endorser config. Paths are relative to the integration/
# package directory (where go test runs). No gateway section: this process
# is dialed as a remote endorser over gRPC, not run as a combined app.
#
# Unlike the fabric-x setup, each org here syncs from its own peer.

network:
  protocol: fabric
  channel: mychannel
  namespace: basic
  ns-version: "1.0"
  chain-id: 4011

logging:
  spec: info

committer:
  endpoint:
    host: 127.0.0.1
    port: 7061
  tls:
    mode: tls
    server-name: peer0.org2.example.com
    ca-cert-paths:
      - ../testdata/fablo/fablo-target/fabric-config/crypto-config/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/tls/ca.crt

endorser:
  name: org2
  identity:
    msp-id: Org2MSP
    msp-dir: ../testdata/fablo/fablo-target/fabric-config/crypto-config/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/msp
  database:
    database: memory
