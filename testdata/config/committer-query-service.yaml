---
server:
  endpoint: :7001
  # The committer defaults to 5000 req/s, burst 1000. An endorser reading from
  # the query service sends several reads per transaction, which blows through
  # that, so tests turn it off (0). In production, size it to the endorsers.
  rate-limit:
    requests-per-second: 0
    burst: 0
  tls:
    mode: mtls
    cert-path: /node-tls/server.crt
    key-path: /node-tls/server.key
    ca-cert-paths:
      - /org-tls-ca.pem
monitoring:
  endpoint: :2117
  tls:
    mode: none

database:
  endpoints:
    - committer-db:5432
  username: "sc_user"
  password: "sc_secret_pwd"
  database: "sc_db"
  tls:
    mode: none
  max-connections: 10
  min-connections: 5
  load-balance: false
  retry:
    initial-interval: 500ms
    randomization-factor: 0.5
    multiplier: 1.5
    max-interval: 60s
    max-elapsed-time: 15m

# Defaults (1024 / 100ms) are tuned for bulk readers. An endorser reads one key
# at a time, so it never fills a batch and every read would wait out the window;
# answer each read as soon as it arrives instead.
min-batch-keys: 1
max-batch-wait: 100us
view-aggregation-window: 100ms
max-aggregated-views: 1024
max-view-timeout: 10s
max-active-views: 4096
max-request-keys: 10000

logging:
  logSpec: info:grpc=error
